name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint --if-present
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
        env:
          AUTH_RESEND_KEY: ci-placeholder
          AUTH_EMAIL_FROM: noreply@vandertweel.example
          AUTH_SECRET: ci-placeholder-not-a-real-secret-0000000000
          DATABASE_URL: postgresql://user:pass@ci-placeholder.neon.tech/neondb?sslmode=require

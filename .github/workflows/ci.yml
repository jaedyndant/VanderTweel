name: CI

on:
  pull_request:
    branches: [main, 'integration/**']
    # Retargeting an existing PR also needs validation against its new base.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    # All branch names, including names containing slashes; no tag-only pushes.
    branches: ['**']

permissions:
  contents: read

concurrency:
  # A branch push must not cancel the PR's merged-result check (or vice versa).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vdt-local-fixture-only
          POSTGRES_DB: vdt_completion_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Additive migrations and PostgreSQL integration tests
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:vdt-local-fixture-only@127.0.0.1:55439/vdt_completion_test
          VDT_LOCAL_TEST: '1'
          APP_URL: http://127.0.0.1:3029
          MAIL_TRANSPORT: local-capture
          LOCAL_MAIL_DIR: /tmp/vdt-ci-mail
      - name: Build
        run: npm run build
        env:
          AUTH_RESEND_KEY: ci-placeholder
          AUTH_EMAIL_FROM: noreply@vandertweel.example
          AUTH_SECRET: ci-placeholder-not-a-real-secret-0000000000
          DATABASE_URL: postgresql://user:pass@ci-placeholder.neon.tech/neondb?sslmode=require

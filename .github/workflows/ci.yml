name: CI

on:
  pull_request:
    branches: [main, 'integration/**']
    # Retargeting an existing PR also needs validation against its new base.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    # All branch names, including names containing slashes; no tag-only pushes.
    branches: ['**']

permissions:
  contents: read

concurrency:
  # A branch push must not cancel the PR's merged-result check (or vice versa).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
        env:
          AUTH_RESEND_KEY: ci-placeholder
          AUTH_EMAIL_FROM: noreply@vandertweel.example
          AUTH_SECRET: ci-placeholder-not-a-real-secret-0000000000
          DATABASE_URL: postgresql://user:pass@ci-placeholder.neon.tech/neondb?sslmode=require
